<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a New Password | CarePlus</title>
<link rel="stylesheet" href="forgotPassword.css?v=eb6d53fb949f6a17">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="supabase-config.js?v=35ad063c735bf101"></script><script defer src="supabase-client.js?v=f0614b16ccf7d087"></script><script defer src="password-recovery.js?v=8f795bb628347fab"></script>
</head>
<body>
<main class="reset-container">
<div class="back-link"><a href="login.html">&larr; Back to Login</a></div>
<div class="reset-header"><div class="logo-icon" aria-hidden="true">&#128272;</div><h1 class="reset-title">CarePlus</h1><p class="reset-subtitle">Account Recovery</p></div>
<div class="step-header"><h2 class="step-title">Set a New Password</h2><p class="step-subtitle">Choose a new password for your CarePlus account.</p></div>
<p id="recovery-status" role="status" aria-live="polite" hidden></p>
<form id="recovery-form" data-mode="reset">
<div class="form-group"><label class="form-label" for="password">New Password</label><input class="form-control" type="password" id="password" name="password" autocomplete="new-password" minlength="8" required></div>
<div class="form-group"><label class="form-label" for="confirm_password">Confirm New Password</label><input class="form-control" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required></div>
<button class="btn btn-warning" type="submit" disabled>Update Password</button>
</form>
<p class="step-subtitle"><a href="forgotPassword.html">Request a new reset link</a></p>
</main>
</body></html>
