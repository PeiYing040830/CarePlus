<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password? | CarePlus</title>
<link rel="stylesheet" href="forgotPassword.css?v=eb6d53fb949f6a17">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="supabase-config.js?v=35ad063c735bf101"></script><script defer src="supabase-client.js?v=f0614b16ccf7d087"></script><script defer src="password-recovery.js?v=8f795bb628347fab"></script>
</head>
<body>
<main class="reset-container">
<div class="back-link"><a href="login.html">&larr; Back to Login</a></div>
<div class="reset-header"><div class="logo-icon" aria-hidden="true">&#128272;</div><h1 class="reset-title">CarePlus</h1><p class="reset-subtitle">Account Recovery</p></div>
<div class="step-header"><h2 class="step-title">Forgot Password?</h2><p class="step-subtitle">Enter your email and we will send you a password reset link.</p></div>
<p id="recovery-status" role="status" aria-live="polite" hidden></p>
<form id="recovery-form" data-mode="request">
<div class="form-group"><label class="form-label" for="email">Email Address</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" placeholder="Enter your registered email" required></div>
<button class="btn btn-warning" type="submit" >Send Reset Link</button>
</form>
<p class="step-subtitle"><a href="login.html">Remember your password? Sign in</a></p>
</main>
</body></html>
